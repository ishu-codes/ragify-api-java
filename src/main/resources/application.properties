spring.application.name=ragify
server.port=${PORT:8000}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragify}
spring.datasource.username=${DB_USER:ragify}
spring.datasource.password=${DB_PASSWORD:ragify}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.json_format_mapper=ragify.config.Jackson3JsonFormatMapper
spring.sql.init.mode=always
spring.jackson.property-naming-strategy=SNAKE_CASE

# Multipart uploads (PDFs and reports can exceed Spring's 1MB default)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Auth
app.jwt-secret=${JWT_SECRET:super-secret-code}
app.jwt-expires-minutes=${JWT_EXPIRES_MINUTES:60}

# CORS (comma-separated)
app.cors-origins=${CORS_ORIGINS:http://localhost:3000}

# Storage (uploaded documents)
app.storage-path=${STORAGE_PATH:storage/workspaces}

# ragify-rag gRPC endpoint
app.grpc-endpoint=${RAGIFY_GRPC_ENDPOINT:localhost:50051}
